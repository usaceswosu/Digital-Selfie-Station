<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Photo Booth Camera</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/index.js" defer></script>
</head>

<body>
    <header>
        <h2>Photo Booth</h2>
    </header>

    <div class="viewfinder">
        <video id="webcam" autoplay playsinline muted></video>

        <div id="countdown" class="countdown-display"></div>

        <div class="controls">
            <button id="flipBtn" class="btn-icon" title="Switch Camera">
                <img src="assets/flip.svg" alt="Flip Camera">
            </button>
            <button id="snapBtn" class="btn-icon btn-large" title="Take Picture">
                <img src="assets/capture.svg" alt="Snap Photo">
            </button>
            <button id="timerBtn" class="btn-icon" title="5s Timer">
                <img src="assets/timer.svg" alt="Timer">
            </button>
        </div>
    </div>
</body>
</html>
